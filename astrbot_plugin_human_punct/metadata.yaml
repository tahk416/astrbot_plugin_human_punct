name: astrbot_plugin_human_punct
display_name: 鱼洗标点
desc: 发送前把回复标点洗得更像真人打字：句号删掉、逗号/分号变空格。问号叹号保留，半角标点智能保护（版本号 1.2.6、千分位 1,000、URL、文件名不误伤），代码块整段跳过。挂在 on_decorating_result 钩子最后执行（priority=-100），与表情包等装饰插件不冲突；普通回复和主动消息（astrbot_plugin_proactive_chat）两条链路都覆盖。即装即用，配置里六个开关可微调。
version: 1.0.2
